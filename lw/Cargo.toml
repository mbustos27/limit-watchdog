[package]
name = "lw"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Limit watchdog helper: a per-session ledger of background agents and the timing decisions for resuming them after a Claude usage-limit reset."

[[bin]]
name = "lw"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_System_WinRT", "UI_Notifications", "Data_Xml_Dom", "Foundation"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
